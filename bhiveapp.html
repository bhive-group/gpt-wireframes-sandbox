}

function StatusPill({ status }) {
  const m = { active:{bg:"#ECFDF5",color:"#059669",label:"Active"}, upcoming:{bg:"#EFF6FF",color:"#3B82F6",label:"Upcoming"}, completed:{bg:"#F5F5F5",color:"#888",label:"Completed"}, cancelled:{bg:"#FFF0F0",color:"#E53935",label:"Cancelled"} };

  return <span style={{background:s.bg,color:s.color,fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:20}}>{s.label}</span>;
}

// ── E-KYC Modal (Option 2 — on app open, disguised skip) ──────────────────
function EKYCModal({ onComplete, onSkip }) {
  const [step, setStep] = useState("intro"); // intro | aadhaar | otp | verifying | success
  const [aadhaar, setAadhaar] = useState("");
  const [otp, setOtp] = useState(["","","","","",""]);
  const [error, setError] = useState("");
  const [timer, setTimer] = useState(0);
  const [agreed, setAgreed] = useState(false);

  const fmt = v => v.replace(/\D/g,"").slice(0,12).replace(/(\d{4})(?=\d)/g,"$1 ").trim();

  const sendOTP = () => {
    if (aadhaar.replace(/\s/g,"").length !== 12) { setError("Please enter a valid 12-digit Aadhaar number."); return; }
    if (!agreed) { setError("Please accept the terms to continue."); return; }
    setStep("otp"); setTimer(30);
    const iv = setInterval(()=>setTimer(t=>{if(t<=1){clearInterval(iv);return 0;}return t-1;}),1000);
  };
  const handleOtpChange = (val, i) => {
    if (!/^\d*$/.test(val)) return;
    const n=[...otp]; n[i]=val.slice(-1); setOtp(n); setError("");
    if (val && i<5) { const el=document.getElementById(`ekyc-otp-${i+1}`); if(el) el.focus(); }
  };
  const handleOtpKey = (e, i) => {
    if (e.key==="Backspace" && !otp[i] && i>0) { const el=document.getElementById(`ekyc-otp-${i-1}`); if(el) el.focus(); }
  };
  const verify = () => {
    if (otp.join("").length<6) { setError("Please enter the complete 6-digit OTP."); return; }
    setStep("verifying");
    setTimeout(()=>{ setStep("success"); setTimeout(onComplete, 1400); }, 1800);
  };
  const masked = aadhaar.replace(/\s/g,"").replace(/(\d{8})(\d{4})/,"XXXX XXXX $2");

  return (
    <div style={{position:"absolute",inset:0,zIndex:200,display:"flex",flexDirection:"column",justifyContent:"flex-end"}}>
      <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.6)",backdropFilter:"blur(6px)"}}/>
      <div style={{position:"relative",background:"#fff",borderRadius:"28px 28px 0 0",zIndex:1,maxHeight:"90%",display:"flex",flexDirection:"column"}}>
        {/* Drag handle + disguised close */}
        <div style={{display:"flex",justifyContent:"center",padding:"12px 0 4px",position:"relative"}}>
          <div style={{width:36,height:4,background:"#E0E0E0",borderRadius:2}}/>
          {/* Disguised skip — small, low contrast, easy to miss */}
          <button onClick={onSkip} style={{position:"absolute",right:16,top:10,background:"none",border:"none",cursor:"pointer",padding:4,opacity:0.3}}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#999" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <div style={{overflowY:"auto",padding:"8px 24px 36px"}}>
          {step==="intro"&&(
            <>
              <div style={{textAlign:"center",marginBottom:24,paddingTop:8}}>
                <div style={{width:64,height:64,borderRadius:20,background:"linear-gradient(135deg,#111,#2d2d2d)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px"}}>
                  <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" strokeWidth="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </div>
                <p style={{margin:"0 0 6px",fontSize:22,fontWeight:900,color:"#111",letterSpacing:-0.5}}>Verify your identity</p>
                <p style={{margin:0,fontSize:14,color:"#999",lineHeight:1.6}}>Complete a one-time E-KYC for<br/>seamless, queue-free check-in at all BHIVE spaces.</p>
              </div>
              <div style={{background:"#F8F8F8",borderRadius:16,padding:"16px",marginBottom:24}}>
                {[["⚡","Instant entry","Walk in without waiting at reception"],["🔒","100% secure","Your data is encrypted and never shared"],["✅","One-time only","Verify once, use everywhere"]].map(([ic,title,sub])=>(
                  <div key={title} style={{display:"flex",gap:12,alignItems:"flex-start",marginBottom:title==="One-time only"?0:14}}>
                    <span style={{fontSize:20,flexShrink:0}}>{ic}</span>
                    <div><p style={{margin:"0 0 2px",fontSize:13,fontWeight:700,color:"#111"}}>{title}</p><p style={{margin:0,fontSize:12,color:"#999"}}>{sub}</p></div>
                  </div>
                ))}
              </div>
              <button onClick={()=>setStep("aadhaar")} style={{width:"100%",background:"#111",border:"none",borderRadius:14,padding:"15px",fontSize:15,fontWeight:800,color:"#fff",cursor:"pointer",marginBottom:10}}>
                Verify with Aadhaar →
              </button>
              <p style={{margin:"8px 0 0",fontSize:11,color:"#ccc",textAlign:"center",lineHeight:1.6}}>By verifying you agree to BHIVE's <span style={{color:"#F59E0B"}}>Terms</span> & <span style={{color:"#F59E0B"}}>Privacy Policy</span></p>
            </>
          )}

          {step==="aadhaar"&&(
            <>
              <div style={{marginBottom:20,paddingTop:4}}>
                <p style={{margin:"0 0 4px",fontSize:20,fontWeight:800,color:"#111"}}>Enter Aadhaar number</p>
                <p style={{margin:0,fontSize:13,color:"#999"}}>We'll send an OTP to your linked mobile</p>
              </div>
              <p style={{margin:"0 0 6px",fontSize:12,fontWeight:700,color:"#555",letterSpacing:0.3,textTransform:"uppercase"}}>Aadhaar Number</p>
              <div style={{position:"relative",marginBottom:6}}>
                <input value={aadhaar} onChange={e=>{setError("");setAadhaar(fmt(e.target.value));}} placeholder="XXXX XXXX XXXX" maxLength={14} style={{width:"100%",border:`2px solid ${error?"#E53935":"#E8E8E8"}`,borderRadius:14,padding:"14px 48px 14px 16px",fontSize:20,fontWeight:700,color:"#111",letterSpacing:2,outline:"none",boxSizing:"border-box",background:"#FAFAFA"}}/>
                <div style={{position:"absolute",right:14,top:"50%",transform:"translateY(-50%)"}}>
                  {aadhaar.replace(/\s/g,"").length===12?<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10B981" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#bbb" strokeWidth="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>}
                </div>
              </div>
              {error&&<p style={{margin:"0 0 10px",fontSize:12,color:"#E53935",fontWeight:500}}>{error}</p>}
              <div onClick={()=>setAgreed(!agreed)} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"12px",background:"#F8F8F8",borderRadius:12,marginBottom:20,cursor:"pointer",border:`1.5px solid ${agreed?"#F59E0B":"#F0F0F0"}`}}>
                <div style={{width:20,height:20,borderRadius:6,border:`2px solid ${agreed?"#F59E0B":"#ccc"}`,background:agreed?"#F59E0B":"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1}}>
                  {agreed&&<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>}
                </div>
                <p style={{margin:0,fontSize:12,color:"#666",lineHeight:1.5}}>I consent to BHIVE verifying my identity using UIDAI's Aadhaar authentication. My data will not be stored.</p>
              </div>
              <button onClick={sendOTP} style={{width:"100%",background:"#111",border:"none",borderRadius:14,padding:"15px",fontSize:15,fontWeight:800,color:"#fff",cursor:"pointer"}}>Send OTP</button>
            </>
          )}

          {step==="otp"&&(
            <>
              <div style={{marginBottom:20,paddingTop:4}}>
                <p style={{margin:"0 0 4px",fontSize:20,fontWeight:800,color:"#111"}}>Verify OTP</p>
                <p style={{margin:0,fontSize:13,color:"#999"}}>Sent to mobile linked with <span style={{color:"#F59E0B",fontWeight:700}}>{masked}</span></p>
              </div>
              <div style={{display:"flex",gap:8,marginBottom:8}}>
                {otp.map((d,i)=>(
                  <input key={i} id={`ekyc-otp-${i}`} value={d} onChange={e=>handleOtpChange(e.target.value,i)} onKeyDown={e=>handleOtpKey(e,i)} maxLength={1} style={{flex:1,height:52,textAlign:"center",fontSize:22,fontWeight:800,color:"#111",border:`2px solid ${error?"#E53935":d?"#F59E0B":"#E8E8E8"}`,borderRadius:12,outline:"none",background:d?"#FFFBEB":"#FAFAFA"}}/>
                ))}
              </div>
              {error&&<p style={{margin:"0 0 8px",fontSize:12,color:"#E53935",fontWeight:500}}>{error}</p>}
              <div style={{display:"flex",justifyContent:"flex-end",marginBottom:24}}>
                {timer>0?<span style={{fontSize:12,color:"#bbb"}}>Resend in <b style={{color:"#555"}}>{timer}s</b></span>:<button onClick={sendOTP} style={{background:"none",border:"none",cursor:"pointer",fontSize:13,color:"#F59E0B",fontWeight:700,padding:0}}>Resend OTP</button>}
              </div>
              <button onClick={verify} style={{width:"100%",background:otp.join("").length===6?"#111":"#E8E8E8",border:"none",borderRadius:14,padding:"15px",fontSize:15,fontWeight:800,color:otp.join("").length===6?"#fff":"#bbb",cursor:otp.join("").length===6?"pointer":"not-allowed"}}>Verify & Continue</button>
              <button onClick={()=>{setStep("aadhaar");setOtp(["","","","","",""]);setError("");}} style={{width:"100%",background:"none",border:"none",cursor:"pointer",fontSize:13,color:"#999",fontWeight:600,marginTop:12,padding:0}}>← Change Aadhaar number</button>
            </>
          )}

          {(step==="verifying"||step==="success")&&(
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"24px 0 8px"}}>
              <div style={{width:72,height:72,borderRadius:"50%",background:step==="success"?"#ECFDF5":"#F5F5F7",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:16}}>
                {step==="success"?<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#10B981" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>:<div style={{width:32,height:32,borderRadius:"50%",border:"3px solid #F59E0B",borderTopColor:"transparent",animation:"spin 0.8s linear infinite"}}/>}

function NotificationsScreen({ onBack, onNavigate, onShowQR, onMarkAllRead }) {
  const [notifs, setNotifs] = useState(notificationsData);
  const unread = notifs.filter(n=>n.unread).length;
  const groups = ["Today","This Week","Earlier"];
  const markRead = id => setNotifs(prev=>prev.map(n=>n.id===id?{...n,unread:false}:n));
  const markAll = () => { setNotifs(prev=>prev.map(n=>({...n,unread:false}))); onMarkAllRead(); };
  const actionLabel = { show_qr:"Show QR", rsvp:"RSVP", book:"Book Now", register:"Register" };
  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",background:"#F5F5F7",overflow:"hidden"}}>
      <div style={{background:"#fff",padding:"12px 20px 14px",borderBottom:"1px solid #F0F0F0",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <BackBtn onPress={onBack}/>
            <span style={{fontWeight:800,fontSize:18,color:"#111"}}>Notifications</span>
            {unread>0&&<div style={{background:"#E53935",borderRadius:"50%",minWidth:20,height:20,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 5px"}}><span style={{fontSize:11,fontWeight:800,color:"#fff"}}>{unread}</span></div>}
          </div>
          {unread>0&&<button onClick={markAll} style={{background:"none",border:"none",cursor:"pointer",fontSize:12,color:"#F59E0B",fontWeight:600,padding:0}}>Mark all read</button>}
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"12px 16px 20px"}}>
        {groups.map(group=>{
          const items=notifs.filter(n=>n.group===group);
          if(!items.length) return null;
          return (
            <div key={group} style={{marginBottom:8}}>
              <p style={{margin:"0 0 8px 4px",fontSize:12,fontWeight:700,color:"#999",letterSpacing:0.5,textTransform:"uppercase"}}>{group}</p>
              {items.map(n=>(
                <div key={n.id} onClick={()=>markRead(n.id)} style={{background:n.unread?"#fff":"#FAFAFA",borderRadius:16,marginBottom:8,padding:"13px 14px",boxShadow:n.unread?"0 2px 14px rgba(0,0,0,0.08)":"0 1px 6px rgba(0,0,0,0.04)",border:n.unread?"1.5px solid #F0F0F0":"1.5px solid transparent",cursor:"pointer"}}>
                  <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>

function ProductComparison3Screen({ onBack }) {
  const [idx, setIdx] = useState(0);
  const [liked, setLiked] = useState([]);
  const [disliked, setDisliked] = useState([]);
  const [swipeDir, setSwipeDir] = useState(null); // "left" | "right"
  const [animating, setAnimating] = useState(false);
  const [done, setDone] = useState(false);

  const plan = planCards[idx];
  const included = comparisonFeatures.filter(f => f[plan?.key]);
  const excluded = comparisonFeatures.filter(f => !f[plan?.key]);

  const swipe = (dir) => {
    if (animating || done) return;
    setSwipeDir(dir);
    setAnimating(true);
    setTimeout(() => {
      if (dir === "right") setLiked(p => [...p, planCards[idx].key]);
      else setDisliked(p => [...p, planCards[idx].key]);
      const next = idx + 1;
      if (next >= planCards.length) setDone(true);
      else setIdx(next);
      setSwipeDir(null);
      setAnimating(false);
    }, 320);
  };

  const reset = () => { setIdx(0); setLiked([]); setDisliked([]); setDone(false); setSwipeDir(null); };

  const cardStyle = {
    position:"relative",
    transform: swipeDir === "right" ? "translateX(120%) rotate(18deg)" : swipeDir === "left" ? "translateX(-120%) rotate(-18deg)" : "translateX(0) rotate(0deg)",
    transition: animating ? "transform 0.32s cubic-bezier(0.4,0,0.2,1)" : "none",
    zIndex: 10,
  };

  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",background:"#F5F5F7",overflow:"hidden"}}>
      {/* Header */}
      <div style={{background:"#fff",padding:"12px 20px 16px",borderBottom:"1px solid #F0F0F0",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <BackBtn onPress={onBack}/>
          <div>
            <span style={{fontWeight:800,fontSize:18,color:"#111"}}>Find Your Plan</span>
            {!done && <p style={{margin:"2px 0 0",fontSize:11,color:"#999"}}>👍 swipe right to shortlist · 👎 swipe left to skip</p>}
          </div>
        </div>
      </div>

      {done ? (
        /* Results screen */
        <div style={{flex:1,overflowY:"auto",padding:"24px 20px"}}>
          <div style={{textAlign:"center",marginBottom:24}}>
            <div style={{fontSize:52,marginBottom:12}}>🎉</div>
            <p style={{margin:"0 0 6px",fontSize:22,fontWeight:900,color:"#111",letterSpacing:-0.5}}>You're done!</p>
            <p style={{margin:0,fontSize:13,color:"#999",lineHeight:1.6}}>Here's what you shortlisted</p>
          </div>

          {liked.length > 0 ? (
            <>
              <p style={{margin:"0 0 10px",fontSize:13,fontWeight:700,color:"#059669"}}>✅ Shortlisted ({liked.length})</p>
              {liked.map(k => {
                const p = planCards.find(x => x.key === k);
                return (
                  <div key={k} style={{background:"#fff",borderRadius:18,padding:"14px 16px",marginBottom:10,display:"flex",alignItems:"center",gap:12,boxShadow:"0 2px 12px rgba(0,0,0,0.06)",border:`1.5px solid ${p.border}`}}>
                    <div style={{width:44,height:44,borderRadius:14,background:p.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{p.emoji}</div>
                    <div style={{flex:1}}>
                      <p style={{margin:"0 0 2px",fontSize:14,fontWeight:800,color:"#111"}}>{p.label}</p>
                      <p style={{margin:0,fontSize:11,color:"#999"}}>{p.desc}</p>
                    </div>
                    <button style={{background:p.color,border:"none",borderRadius:10,padding:"7px 14px",fontSize:12,fontWeight:800,color:"#fff",cursor:"pointer",flexShrink:0}}>Get →</button>
                  </div>
                );
              })}
            </>
          ) : (
            <div style={{textAlign:"center",padding:"20px 0"}}>
              <p style={{fontSize:14,color:"#999"}}>You didn't shortlist any plans.</p>
            </div>
          )}

          {disliked.length > 0 && (
            <>
              <p style={{margin:"16px 0 10px",fontSize:13,fontWeight:700,color:"#bbb"}}>Skipped ({disliked.length})</p>
              {disliked.map(k => {
                const p = planCards.find(x => x.key === k);
                return (
                  <div key={k} style={{background:"#FAFAFA",borderRadius:16,padding:"12px 16px",marginBottom:8,display:"flex",alignItems:"center",gap:10,border:"1.5px solid #F0F0F0"}}>
                    <div style={{width:36,height:36,borderRadius:10,background:"#F0F0F0",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0,opacity:0.5}}>{p.emoji}</div>
                    <span style={{fontSize:13,color:"#bbb",fontWeight:600}}>{p.label}</span>
                  </div>
                );
              })}
            </>
          )}

          <button onClick={reset} style={{width:"100%",background:"#111",border:"none",borderRadius:14,padding:"15px",fontSize:15,fontWeight:800,color:"#fff",cursor:"pointer",marginTop:20}}>
            Start Over
          </button>
        </div>
      ) : (
        <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
          {/* Progress */}
          <div style={{padding:"12px 20px 0",flexShrink:0}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <span style={{fontSize:11,color:"#999",fontWeight:600}}>{idx + 1} of {planCards.length}</span>
              <span style={{fontSize:11,color:"#999",fontWeight:600}}>{liked.length} shortlisted</span>
            </div>
            <div style={{height:4,background:"#E8E8E8",borderRadius:2,overflow:"hidden"}}>
              <div style={{height:"100%",width:`${((idx)/planCards.length)*100}%`,background:"#111",borderRadius:2,transition:"width 0.3s"}}/>
            </div>
          </div>

          {/* Card area */}
          <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"16px",position:"relative",overflow:"hidden"}}>

            {/* Ghost next card */}
            {idx + 1 < planCards.length && (
              <div style={{position:"absolute",width:"calc(100% - 48px)",borderRadius:24,background:"#fff",height:200,top:"50%",transform:"translateY(-46%) scale(0.94)",boxShadow:"0 4px 20px rgba(0,0,0,0.08)",zIndex:1}}/>
            )}

            {/* Active card */}
            <div style={{...cardStyle, width:"100%"}}>
              {/* Swipe indicators */}
              {swipeDir === "right" && (
                <div style={{position:"absolute",top:20,left:20,zIndex:20,background:"#ECFDF5",border:"3px solid #10B981",borderRadius:12,padding:"6px 14px",transform:"rotate(-12deg)"}}>
                  <span style={{fontSize:16,fontWeight:900,color:"#10B981"}}>👍 LIKE</span>
                </div>
              )}
              {swipeDir === "left" && (
                <div style={{position:"absolute",top:20,right:20,zIndex:20,background:"#FFF0F0",border:"3px solid #E53935",borderRadius:12,padding:"6px 14px",transform:"rotate(12deg)"}}>
                  <span style={{fontSize:16,fontWeight:900,color:"#E53935"}}>👎 SKIP</span>
                </div>
              )}

              <div style={{background:"#fff",borderRadius:24,boxShadow:"0 8px 32px rgba(0,0,0,0.12)",overflow:"hidden",position:"relative",zIndex:2}}>
                {/* Plan hero */}
                <div style={{background:`linear-gradient(145deg,${plan.color},${plan.color}bb)`,padding:"22px 22px 18px",position:"relative",overflow:"hidden"}}>
                  <div style={{position:"absolute",top:-20,right:-20,width:100,height:100,borderRadius:"50%",background:"rgba(255,255,255,0.1)"}}/>
                  <div style={{position:"absolute",bottom:-10,right:10,fontSize:70,opacity:0.15}}>{plan.emoji}</div>
                  <div style={{display:"inline-flex",background:"rgba(255,255,255,0.18)",borderRadius:20,padding:"4px 12px",marginBottom:10}}>
                    <span style={{fontSize:11,fontWeight:700,color:"#fff"}}>{plan.tag}</span>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:4}}>
                    <span style={{fontSize:28}}>{plan.emoji}</span>
                    <p style={{margin:0,fontSize:22,fontWeight:900,color:"#fff",letterSpacing:-0.5}}>{plan.label}</p>
                  </div>
                  <p style={{margin:0,fontSize:12,color:"rgba(255,255,255,0.7)",lineHeight:1.5}}>{plan.desc}</p>
                </div>

                {/* Features preview */}
                <div style={{padding:"14px 16px",maxHeight:260,overflowY:"auto"}}>
                  {comparisonFeatures.map((f,fi) => {
                    const has = f[plan.key];
                    return (
                      <div key={fi} style={{display:"flex",alignItems:"center",gap:10,paddingBottom:9,marginBottom:fi<comparisonFeatures.length-1?9:0,borderBottom:fi<comparisonFeatures.length-1?"1px solid #F5F5F7":"none"}}>
                        <div style={{width:22,height:22,borderRadius:6,background:has?"#ECFDF5":"#FFF0F0",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                          {has
                            ? <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#10B981" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>
                            : <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#E53935" strokeWidth="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                          }

                        <span style={{fontSize:12,color:has?"#111":"#ccc",fontWeight:has?500:400}}>{f.label}</span>

                  })}
                </div>

                {/* < > nav arrows inside card bottom */}
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 16px 16px",borderTop:"1px solid #F0F0F0",background:"#FAFAFA"}}>

                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>

                  <div style={{textAlign:"center"}}>
                    <p style={{margin:"0 0 1px",fontSize:12,fontWeight:700,color:"#111"}}>{plan.label}</p>

                  <button onClick={()=>swipe("right")} disabled={animating} style={{width:44,height:44,borderRadius:12,background:"#fff",border:"1.5px solid #E8E8E8",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",boxShadow:"0 2px 8px rgba(0,0,0,0.07)"}}>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>

    </div>
  );

  const planColors = ["#7C3AED","#2563EB","#059669","#D97706","#E53935"];

  return (

        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <BackBtn onPress={onBack}/>

      <div style={{flex:1,overflow:"auto"}}>
        <table style={{borderCollapse:"collapse",minWidth:620,width:"100%",fontSize:12}}>
          {/* Header row */}
          <thead>
            <tr>
              <th style={{background:"#DBEAFE",padding:"14px 12px",textAlign:"center",fontWeight:700,fontSize:13,color:"#1e3a5f",borderRight:"1px solid #bcd",borderBottom:"2px solid #93C5FD",position:"sticky",left:0,zIndex:2,minWidth:160}}>
                Features
              </th>
              {plans.map((p,i)=>(
                <th key={i} style={{background:i===plans.length-1?"#BBF7D0":"#DBEAFE",padding:"12px 8px",textAlign:"center",fontWeight:700,fontSize:12,color:i===plans.length-1?"#065F46":"#1e3a5f",borderRight:i<plans.length-1?"1px solid #bcd":"none",borderBottom:"2px solid #93C5FD",minWidth:90,whiteSpace:"pre-line",lineHeight:1.3,borderLeft:i===plans.length-1?"2px solid #10B981":"none"}}>
                  {p}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {comparisonFeatures.map((f,fi)=>{
              const isYellow = fi < 8;
              const isPink = fi >= 14;
              const rowBg = isYellow ? "#FEFCE8" : isPink ? "#FFF0F0" : "#fff";
              const featureFontWeight = 700;
              return (
                <tr key={f.label}>
                  <td style={{background:rowBg,padding:"10px 12px",fontWeight:featureFontWeight,fontSize:12,color:"#111",borderRight:"1px solid #E0E0E0",borderBottom:"1px solid #EFEFEF",position:"sticky",left:0,zIndex:1}}>
                    {f.label}
                  </td>
                  {planKeys.map((k,ki)=>{
                    const has = f[k];
                    const isLast = ki === planKeys.length - 1;
                    return (
                      <td key={k} style={{background:has?"#DCFCE7":"#FFE4E6",textAlign:"center",padding:"10px 8px",borderRight:ki<planKeys.length-1?"1px solid #E0E0E0":"none",borderBottom:"1px solid #EFEFEF",borderLeft:isLast?"2px solid #10B981":"none"}}>
                        {has ? (
                          <div style={{width:22,height:22,borderRadius:5,border:"2px solid #16A34A",background:"#DCFCE7",display:"inline-flex",alignItems:"center",justifyContent:"center"}}>
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#16A34A" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>
                          </div>
                        ) : (
                          <div style={{width:22,height:22,borderRadius:5,border:"2px solid #F87171",background:"#FFE4E6",display:"inline-flex",alignItems:"center",justifyContent:"center"}}>
                            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#EF4444" strokeWidth="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                          </div>
                        )}
                      </td>
                    );
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

                <button onClick={()=>setActiveIdx(i=>Math.max(0,i-1))} disabled={activeIdx===0} style={{width:48,height:48,borderRadius:14,border:"2px solid #E8E8E8",background:"#fff",display:"flex",alignItems:"center",justifyContent:"center",cursor:activeIdx===0?"not-allowed":"pointer",opacity:activeIdx===0?0.4:1,flexShrink:0}}>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" strokeWidth="2.5"><polyline points="15 18 9 12 15 6"/></svg>
                </button>
                <button style={{flex:1,background:plan.color,border:"none",borderRadius:14,padding:"14px",fontSize:14,fontWeight:800,color:"#fff",cursor:"pointer"}}>
                  Get {plan.label} →
                </button>
                <button onClick={()=>setActiveIdx(i=>Math.min(planCards.length-1,i+1))} disabled={activeIdx===planCards.length-1} style={{width:48,height:48,borderRadius:14,border:"2px solid #E8E8E8",background:"#fff",display:"flex",alignItems:"center",justifyContent:"center",cursor:activeIdx===planCards.length-1?"not-allowed":"pointer",opacity:activeIdx===planCards.length-1?0.4:1,flexShrink:0}}>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" strokeWidth="2.5"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
              </div>

              {/* Plan name pills for quick jump */}
              <div style={{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"center"}}>
                {planCards.map((p,pi)=>(
                  <button key={p.key} onClick={()=>setActiveIdx(pi)} style={{padding:"5px 12px",borderRadius:20,border:`1.5px solid ${pi===activeIdx?p.color:"#E8E8E8"}`,background:pi===activeIdx?p.bg:"#fff",cursor:"pointer",fontSize:11,fontWeight:700,color:pi===activeIdx?p.color:"#bbb",transition:"all 0.15s"}}>
                    {p.emoji} {p.label}
                  </button>
                ))}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function BhiveApp() {
  const [screen, setScreen] = useState("home");
  const [activeTab, setActiveTab] = useState("home");
  const [showQR, setShowQR] = useState(false);
  const [unreadCount, setUnreadCount] = useState(3);
  const [kycDone, setKycDone] = useState(false);
  const [showKYC, setShowKYC] = useState(true); // Option 2: show on app open

  const [compareTab, setCompareTab] = useState("profile");
  const navigate = s => {
    if (s==="compare") { setCompareTab("compare"); setScreen("menu"); setActiveTab("menu"); return; }
    setScreen(s);
    if(["home","daypass","team","menu"].includes(s)) { setActiveTab(s); setCompareTab("profile"); }
  };
  const tabs = [
    { id:"home", label:"Home", Ic:HomeIcon },
    { id:"daypass", label:"Day Pass", Ic:PassIcon },
    { id:"team", label:"Team", Ic:TeamIcon },
    { id:"menu", label:"More", Ic:MenuIcon },
  ];

  const renderScreen = () => {
    if (screen==="home") return <HomeScreen onNavigate={navigate} onShowQR={()=>setShowQR(true)} kycDone={kycDone} onStartKYC={()=>setShowKYC(true)}/>;
    if (screen==="daypass") return <DayPassScreen onNavigate={navigate} onShowQR={()=>setShowQR(true)}/>;
    if (screen==="menu") return <MoreScreen onNavigate={navigate} unreadCount={unreadCount} kycDone={kycDone} onStartKYC={()=>setShowKYC(true)} initialTab={compareTab}/>;
    if (screen==="activity") return <MyActivityScreen onBack={()=>navigate("menu")} onShowQR={()=>setShowQR(true)}/>;
    if (screen==="notifications") return <NotificationsScreen onBack={()=>navigate("menu")} onNavigate={navigate} onShowQR={()=>setShowQR(true)} onMarkAllRead={()=>setUnreadCount(0)}/>;
    if (screen==="notif_prefs") return <NotifPrefsScreen onBack={()=>navigate("notifications")}/>;
    if (screen==="ticket") return <RaiseTicketScreen onBack={next=>navigate(next||"menu")}/>;
    if (screen==="ticket_success") return <TicketSuccessScreen onBack={()=>navigate("menu")} onView={()=>navigate("my_tickets")}/>;
    if (screen==="my_tickets") return <MyTicketsScreen onBack={()=>navigate("menu")}/>;
    if (screen==="product_comparison") return <ProductComparisonTableScreen onBack={()=>navigate("menu")}/>;
    if (screen==="product_comparison_3") return <ProductComparison3Screen onBack={()=>navigate("menu")}/>;
    if (screen==="product_comparison_4") return <ProductComparison4Screen onBack={()=>navigate("menu")}/>;
    return <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:12,color:"#bbb"}}><div style={{fontSize:48}}>🚧</div><p style={{margin:0,fontSize:14,fontWeight:600}}>Coming soon</p></div>;
  };

  return (
    <div style={{display:"flex",justifyContent:"center",alignItems:"center",minHeight:"100vh",background:"linear-gradient(135deg,#1a1a2e 0%,#16213e 100%)",fontFamily:"-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif"}}>
      <div style={{width:393,height:852,background:"#F5F5F7",borderRadius:50,overflow:"hidden",boxShadow:"0 40px 100px rgba(0,0,0,0.5),0 0 0 12px #0f0f0f,0 0 0 14px #2a2a2a",display:"flex",flexDirection:"column",position:"relative"}}>
        <StatusBar/>
        <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
          {renderScreen()}
        </div>
        <div style={{background:"#fff",borderTop:"1px solid #EFEFEF",display:"flex",padding:"10px 8px 24px",flexShrink:0}}>
          {tabs.map(({id,label,Ic})=>{
            const isActive=activeTab===id;
            return (
              <button key={id} onClick={()=>navigate(id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,background:"none",border:"none",cursor:"pointer",padding:"4px 0",position:"relative"}}>
                {isActive&&<div style={{position:"absolute",top:-10,left:"50%",transform:"translateX(-50%)",width:28,height:3,background:"#111",borderRadius:"0 0 4px 4px"}}/>}
                <div style={{position:"relative"}}>
                  <Ic active={isActive}/>
                  {id==="menu"&&unreadCount>0&&<div style={{position:"absolute",top:-3,right:-3,width:8,height:8,borderRadius:"50%",background:"#E53935",border:"1.5px solid #fff"}}/>}
                </div>
                <span style={{fontSize:10,fontWeight:isActive?700:500,color:isActive?"#111":"#bbb"}}>{label}</span>
              </button>
            );
          })}
        </div>
        {showQR&&<QRSheet pass={activePass} onClose={()=>setShowQR(false)}/>}
        {/* Option 2: E-KYC modal on app open */}
        {showKYC&&!kycDone&&(
          <EKYCModal
            onComplete={()=>{ setKycDone(true); setShowKYC(false); }}
            onSkip={()=>setShowKYC(false)}
          />
        )}
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<BhiveApp />);
  </script>
</body>
